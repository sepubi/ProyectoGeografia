<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Geografía Interactiva | Práctica 10</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: rgba(24, 24, 27, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(3px);
            z-index: -1;
        }

        header {
            max-width: 1400px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .branding h1 {
            font-size: 2rem;
            background: linear-gradient(to right, #ffffff, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
            gap: 30px;
        }

        .dashboard-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        .card-header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; }

        .tag { 
            font-size: 0.7rem; padding: 4px 10px; border-radius: 20px; 
            background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); 
        }

        .window-frame { background: #000; display: flex; flex-direction: column; }

        .window-top {
            background: #1f1f23;
            height: 30px;
            display: flex;
            align-items: center;
            padding-left: 12px;
            gap: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        /* Contenedor para los Mapas Interactivos */
        .map-container {
            width: 100%;
            height: 450px;
            background: #050505;
        }

        /* Contenedor para los GIFs */
        .img-container {
            width: 100%;
            height: 450px;
            background: #050505;
            display: flex;
            justify-content: center;
        }

        .img-container img {
            max-width: 100%;
            height: 100%;
            object-fit: contain;
        }

        footer { text-align: center; margin-top: 60px; color: var(--text-muted); padding-bottom: 40px; }
    </style>
</head>
<body>

<header>
    <div class="branding">
        <h1>Geografía Interactiva</h1>
        <p>Análisis de Aguas y TimeLapse • Práctica 10</p>
    </div>
</header>

<main>
    <article class="dashboard-card">
        <div class="card-header">
            <h3><i class="ri-drop-line" style="color: #60a5fa;"></i> WebMap Chapala (G6)</h3>
            <span class="tag">Interactivo</span>
        </div>
        <div class="window-frame">
            <div class="window-top">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            </div>
            <div id="map-chapala" class="map-container"></div>
        </div>
    </article>

    <article class="dashboard-card">
        <div class="card-header">
            <h3><i class="ri-drop-line" style="color: #60a5fa;"></i> WebMap Rukwa (G7)</h3>
            <span class="tag">Interactivo</span>
        </div>
        <div class="window-frame">
            <div class="window-top">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            </div>
            <div id="map-rukwa" class="map-container"></div>
        </div>
    </article>

    <article class="dashboard-card">
        <div class="card-header">
            <h3><i class="ri-movie-line" style="color: #a78bfa;"></i> TimeLapse L9</h3>
            <span class="tag">GIF 2024</span>
        </div>
        <div class="window-frame">
            <div class="window-top">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            </div>
            <div class="img-container">
                <img src="TimeLapse_L9.gif" alt="TimeLapse Landsat 9">
            </div>
        </div>
    </article>

    <article class="dashboard-card">
        <div class="card-header">
            <h3><i class="ri-movie-line" style="color: #a78bfa;"></i> TimeLapse S2</h3>
            <span class="tag">GIF 2024</span>
        </div>
        <div class="window-frame">
            <div class="window-top">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            </div>
            <div class="img-container">
                <img src="TimeLapse_S2.gif" alt="TimeLapse Sentinel 2">
            </div>
        </div>
    </article>
</main>

<footer>
    <p>Desarrollado por <strong>Alexandru David</strong> y <strong>Sergi Puig</strong> &mdash; 2026</p>
</footer>

<script>
    // Función mejorada para crear mapas con opción de rotación
    function crearMapa(id, lat, lon, zoom, imgUrl, bounds, rotacion = 0) {
        var map = L.map(id).setView([lat, lon], zoom);
        
        // Capa satélite de alta calidad
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri &mdash; Satélite'
        }).addTo(map);

        // Creamos la superposición de imagen
        var overlay = L.imageOverlay(imgUrl, bounds, {
            opacity: 0.8,
            interactive: true,
            className: id + '-img' // Clase única para aplicar el giro por CSS
        }).addTo(map);

        // Si hay rotación, aplicamos CSS cuando la imagen se cargue
        if (rotacion !== 0) {
            overlay.on('add', function () {
                var el = overlay.getElement();
                el.style.transformOrigin = 'center';
                el.style.transform += ' rotate(' + rotacion + 'deg)';
            });
        }
    }

    // --- CONFIGURACIÓN DE TUS MAPAS ---

    // Chapala: (Sin rotación, suele encajar bien horizontal)
    var boundsChapala = [[20.0, -103.6], [20.5, -102.7]]; 
    crearMapa('map-chapala', 20.25, -103.15, 10, 'G6_NDWI_Chapala_2025.png', boundsChapala, 0);

    // Rukwa: Aplicamos un giro de -5 grados para alinear con el pantano
    var boundsRukwa = [[-8.6, 31.6], [-7.4, 32.9]];
    crearMapa('map-rukwa', -8.0, 32.25, 9, 'G7_MNDWI_Rukwa_2025.png', boundsRukwa, -5);

</script>

</body>
</html>
