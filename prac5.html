<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geografía Interactiva | Práctica 5</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: rgba(24, 24, 27, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #22c55e;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(3px); z-index: -1;
        }

        /* --- HEADER --- */
        header {
            max-width: 1200px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        /* Contenedor de botones a la derecha */
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .branding h1 {
            font-size: 2rem;
            background: linear-gradient(to right, #ffffff, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Botones superiores */
        .btn-header {
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .btn-header:hover { 
            background: var(--primary); 
            color: #000; 
            transform: translateY(-2px);
        }

        .dashboard-card {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        .window-top {
            background: #1f1f23;
            height: 35px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 8px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }

        #webmap {
            width: 100%;
            height: 600px;
            background: #111;
        }

        .card-footer {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
        }

        footer { text-align: center; margin-top: 40px; color: var(--text-muted); padding-bottom: 20px; }
    </style>
</head>
<body>

<header>
    <div class="branding">
        <h1>Geografía Interactiva</h1>
        <p>Análisis de Severidad • Práctica 5</p>
    </div>
    
    <div class="header-actions">
        <a href="pdf/5_SENTINEL-1.pdf" download class="btn-header" style="border-color: var(--primary);">
            <i class="ri-file-pdf-line"></i> Descargar Ejercicio
        </a>

        <a href="index.html" class="btn-header">
            <i class="ri-arrow-left-line"></i> Volver al Menú
        </a>
    </div>
</header>

<main>
    <article class="dashboard-card">
        <div class="window-top">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span style="margin-left: 10px; font-size: 0.8rem; color: var(--text-muted);">Leaflet Engine • SEVERIDAD.png</span>
        </div>

        <div id="webmap"></div>

        <div class="card-footer">
            <div>
                <h2 style="font-size: 1.2rem;"><i class="ri-map-fill"></i> Mapa Interactivo</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Usa el ratón para moverte y hacer zoom sobre la zona analizada.</p>
            </div>
            <a href="pdf/SEVERIDAD.png" target="_blank" style="color:var(--primary); text-decoration:none; font-size:0.9rem;">
                <i class="ri-image-line"></i> Abrir imagen original
            </a>
        </div>
    </article>
</main>

<footer>
    <p>Desarrollado por <strong>Alexandru David</strong> y <strong>Sergi Puig</strong> &mdash; 2026</p>
</footer>

<script>
    var map = L.map('webmap').setView([40.4167, -3.7033], 12);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri'
    }).addTo(map);

    var imageBounds = [[40.35, -3.80], [40.48, -3.60]]; 

    L.imageOverlay('pdf/SEVERIDAD.png', imageBounds, {
        opacity: 0.8,
        interactive: true
    }).addTo(map);

    map.fitBounds(imageBounds);
</script>

</body>
</html>
